<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self';">
  <title>InfiniteDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="bubble" class="bubble" title="InfiniteDesk — Press Ctrl+E+F to expand">
    <div class="bubble-inner">
      <svg class="bubble-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.739-8z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="bubble-pulse"></div>
    <div class="bubble-pulse bubble-pulse-delayed"></div>
  </div>
  <div id="panel" class="panel hidden">
    <header class="panel-header" id="panel-header">
      <div class="panel-logo">
        <div class="logo-icon-wrap">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none">
            <path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.739-8z"
                  stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24">
                <stop offset="0%" stop-color="#3B82F6"/>
                <stop offset="100%" stop-color="#8B5CF6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-title">InfiniteDesk</span>
          <span class="logo-subtitle" id="zone-label">Zone: Home (0, 0)</span>
        </div>
      </div>
      <div class="panel-actions">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button id="minimize-btn" class="icon-btn" title="Minimize to bubble" aria-label="Minimize">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 14 10 14 10 20"/>
            <polyline points="20 10 14 10 14 4"/>
            <line x1="14" y1="10" x2="21" y2="3"/>
            <line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>
      </div>
    </header>
    <section class="stats-section">
      <div class="stat-card" id="cpu-card">
        <div class="stat-ring-container">
          <svg class="stat-ring" viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="50"/>
            <circle class="ring-fill ring-cpu" id="cpu-ring" cx="60" cy="60" r="50"
                    stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
          </svg>
          <div class="stat-center">
            <span class="stat-value" id="cpu-value">0</span>
            <span class="stat-unit">%</span>
          </div>
        </div>
        <span class="stat-label">CPU</span>
      </div>
      <div class="stat-card" id="ram-card">
        <div class="stat-ring-container">
          <svg class="stat-ring" viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="50"/>
            <circle class="ring-fill ring-ram" id="ram-ring" cx="60" cy="60" r="50"
                    stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
          </svg>
          <div class="stat-center">
            <span class="stat-value" id="ram-value">0</span>
            <span class="stat-unit">%</span>
          </div>
        </div>
        <span class="stat-label">RAM</span>
      </div>
      <div class="stat-card stat-card-mini" id="windows-card">
        <div class="stat-mini-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <span class="stat-value stat-value-large" id="window-count">0</span>
        <span class="stat-label">Windows</span>
      </div>
    </section>
    <section class="workspace-section">
      <div class="section-header">
        <h3 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="section-icon">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
          Workspace Navigator
        </h3>
        <span class="zone-coords" id="zone-coords">(0, 0)</span>
      </div>
      <div class="workspace-grid" id="workspace-grid">
      </div>
    </section>
    <section class="windows-section">
      <div class="section-header">
        <h3 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="section-icon">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          Open Windows
        </h3>
        <span class="badge" id="window-badge">0</span>
      </div>
      <div class="window-list" id="window-list">
        <div class="window-list-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="empty-icon">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
          <span>No windows tracked</span>
        </div>
      </div>
    </section>
    <footer class="panel-footer">
      <div class="nav-controls">
        <div class="nav-row">
          <div class="nav-spacer"></div>
          <button class="nav-btn" data-direction="up" title="Navigate Up" aria-label="Navigate Up">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="18 15 12 9 6 15"/>
            </svg>
          </button>
          <div class="nav-spacer"></div>
        </div>
        <div class="nav-row">
          <button class="nav-btn" data-direction="left" title="Navigate Left" aria-label="Navigate Left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <button class="nav-btn nav-home" data-direction="home" title="Go Home (0,0)" aria-label="Navigate Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </button>
          <button class="nav-btn" data-direction="right" title="Navigate Right" aria-label="Navigate Right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
        <div class="nav-row">
          <div class="nav-spacer"></div>
          <button class="nav-btn" data-direction="down" title="Navigate Down" aria-label="Navigate Down">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="nav-spacer"></div>
        </div>
      </div>
      <div class="footer-info">
        <span class="shortcut-hint">Ctrl+E+F to toggle</span>
      </div>
    </footer>
  </div>
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
