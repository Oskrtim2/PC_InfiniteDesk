appId: com.infinitedesk.app
productName: InfiniteDesk
copyright: Copyright © 2024 InfiniteDesk

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme,test,__tests__,tests,powered-test,example,examples}"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: InfiniteDesk
  menuCategory: true
  artifactName: "InfiniteDesk-Setup-${version}.${ext}"
  installerSidebar: null
  license: null
